[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-toolbox"
version = "2.3.0"
description = "Caja de herramientas de escritorio para foto, audio y video"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "jalvala147", email = "jalvala147@gmail.com" },
]
keywords = ["flet", "ffmpeg", "media", "images", "video"]
dependencies = [
    "flet>=0.24.0",
    "Pillow>=10.0.0",
    "mutagen>=1.47.0",
    "pillow-heif>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["flet[web]>=0.24.0"]

[project.scripts]
media-toolbox = "main:run"

[project.urls]
Homepage = "https://github.com/Jalvala147/media-toolbox"
Releases = "https://github.com/Jalvala147/media-toolbox/releases"
Issues = "https://github.com/Jalvala147/media-toolbox/issues"

[tool.setuptools]
include-package-data = true
py-modules = ["app", "main", "index"]
packages = ["core"]
